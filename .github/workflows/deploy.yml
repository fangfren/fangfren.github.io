name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check for Word articles
        id: articles
        run: |
          node --input-type=commonjs <<'NODE' >> "$GITHUB_OUTPUT"
          const { articles } = require('./content/articles.json');
          const needsPandoc = articles.some(({ file, draft }) =>
            draft !== true && typeof file === 'string' && file.trim().toLowerCase().endsWith('.docx')
          );
          console.log('needs_pandoc=' + needsPandoc);
          NODE

      - name: Install pandoc
        if: steps.articles.outputs.needs_pandoc == 'true'
        run: |
          curl -fsSL -o /tmp/pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.13/pandoc-3.13-linux-amd64.tar.gz
          sudo tar -xzf /tmp/pandoc.tar.gz -C /usr/local --strip-components=1
          pandoc --version | head -n 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
